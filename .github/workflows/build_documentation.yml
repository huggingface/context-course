name: Build documentation

on:
  push:
    branches:
      - main

jobs:
  build:
    uses: huggingface/doc-builder/.github/workflows/build_main_documentation.yml@90ddd199e07144a13408c523680c76987343c95f  # main
    with:
      commit_sha: ${{ github.sha }}
      package: context-course
      package_name: context-course
      path_to_docs: context-course/units/
      additional_args: --not_python_module
      languages: en zh-CN
    secrets:
      hf_token: ${{ secrets.HF_DOC_BUILD_PUSH }}
